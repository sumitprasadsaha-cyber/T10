name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Install web dependencies
      - name: Install dependencies
        run: npm install

      # 4. Build web application
      - name: Build web application
        run: npm run build

      # 5. Java
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 6. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 7. Android SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # 8. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 9. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 10. Make Gradle executable
      - name: Grant Gradle permission
        working-directory: android
        run: chmod +x gradlew

      # 11. Build Release & Debug APKs
      - name: Build Release APK
        working-directory: android
        run: ./gradlew clean assembleRelease assembleDebug

      # 12. Upload Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Academy-Connect-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # 13. Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Academy-Connect-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error